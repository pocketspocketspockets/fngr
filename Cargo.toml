[package]
name = "snuggle"
description = "Simple federated social media inspired by finger"
version = "0.3.0-alpha"
edition = "2024"
license = "GPL-3"
authors = ["Avery Murray <pocketsbuzz@pm.me>"]

[features]
blocking = []

[[bin]]
name = "snuggle-server"
path = "src/snuggle-server/main.rs"

[dependencies]
anyhow = "1.0.100"
base64-url = "3.0.2"
maplit = "1.0.2"
rand = "0.9.2"
reqwest = "0.13.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha-rs = "0.1.0"
tokio = { version = "1.49.0", features = ["full"] }
toml = "0.9.11"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
uuid = "1.19.0"
